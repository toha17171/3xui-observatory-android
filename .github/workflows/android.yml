name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate source tree
        run: python3 tools/check_project.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub-hosted Ubuntu runners include Android SDK command-line tools.
      # setup-android@v3 invokes the obsolete "sdkmanager tools" package
      # and fails with "Failed to find package 'tools'" on current runners.
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "::error::Android SDK cmdline-tools not found under $ANDROID_HOME"
            exit 1
          fi
          echo "Using SDK manager: $SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare release APK
        if: github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk 3xui-observatory-v1.2.0-debug.apk
          sha256sum 3xui-observatory-v1.2.0-debug.apk
      - name: Publish versioned APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=v1.2.0
          FILE=3xui-observatory-v1.2.0-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" \
              --title "3x-ui Observatory Android v1.2.0" \
              --notes "Android 8.0+ debug APK. Compact and expanded widgets, per-widget Observatory filters, and history graphs."
          fi
      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xui-observatory-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
